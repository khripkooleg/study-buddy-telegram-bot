services:
  db:
    image: postgres:18-alpine
    container_name: telegram_postgresql
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - tg_data_vol:/var/lib/postgresql
      - ./docker-postgresql/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./docker-postgresql/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    networks:
      - dbNetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  tg_data_vol:
    driver: local

networks:
  dbNetwork:
    driver: bridge
